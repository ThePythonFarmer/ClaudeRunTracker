<style>
/* Layout: one thumb-width column. Sticky race clock on top, tab bar at the bottom, one bold "next move" card that answers "where do I go now?", the course as a real map. */
:root{
  --bg:#EDF3F5; --surface:#FFFFFF; --ink:#0F2430; --muted:#55707C; --line:#D2DEE3;
  --sea:#0B6A86; --sea-deep:#084E63; --sea-soft:#DCEDF2; --on-sea:#F3FAFC;
  --sun:#E8A015; --sun-ink:#2F1E00; --good:#1B7F4C; --warn:#A5650C; --bad:#B9362F;
  --map-bg:#CFE3EA;
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --r:14px; --tabs-h:62px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#08151B; --surface:#10212A; --ink:#E4EDF0; --muted:#8FA5AF; --line:#243B48; --sea:#4DB2D0; --sea-deep:#0E3F50; --sea-soft:#13313D; --on-sea:#EAF6FA;
  --sun:#F2B43F; --sun-ink:#2A1A00; --good:#4CC488; --warn:#E3A945; --bad:#EE6B62; --map-bg:#0D2630; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#08151B; --surface:#10212A; --ink:#E4EDF0; --muted:#8FA5AF;
  --line:#243B48; --sea:#4DB2D0; --sea-deep:#0E3F50; --sea-soft:#13313D; --on-sea:#EAF6FA;
  --sun:#F2B43F; --sun-ink:#2A1A00; --good:#4CC488; --warn:#E3A945; --bad:#EE6B62; --map-bg:#0D2630; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 calc(var(--tabs-h) + 28px + env(safe-area-inset-bottom,0px));max-width:640px;margin:0 auto}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:1000;background:var(--bg)}
h1,h2,h3{font-family:var(--f-display);font-weight:700;letter-spacing:.01em;text-wrap:balance;margin:0;line-height:1.05}
h2{font-size:1.6rem} h3{font-size:1.2rem}
p{margin:0}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .small{font-size:.86rem}
a{color:var(--sea)}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--sea);outline-offset:2px}
.eyebrow{font-family:var(--f-display);text-transform:uppercase;letter-spacing:.1em;font-size:.82rem;color:var(--muted);font-weight:700}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:900;background:var(--bg);padding-block:10px 8px;display:grid;gap:8px}
.top-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font-family:var(--f-display);font-size:1.1rem;text-transform:uppercase;letter-spacing:.08em;font-weight:700}
.brand span{color:var(--sea)}
.clock{font-family:var(--f-mono);font-size:1.25rem}
.rehearse{display:flex;align-items:center;gap:10px;background:var(--sun);color:var(--sun-ink);border-radius:999px;padding:4px 6px 4px 14px;font-size:.85rem;font-weight:700}
.rehearse input{flex:1;min-width:0;accent-color:var(--sea-deep)}
.rehearse button{border:0;background:var(--sun-ink);color:var(--sun);border-radius:999px;padding:6px 12px;font-weight:700;font-size:.8rem;cursor:pointer}

main{display:grid;gap:14px;padding-top:4px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:12px;min-width:0}

/* runner strip */
.runner{display:grid;gap:10px}
.runner-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.big{font-family:var(--f-display);font-size:2.9rem;line-height:.9;font-weight:700}
.big small{font-size:1.1rem;color:var(--muted);font-weight:600;margin-left:6px}
.bar{position:relative;height:26px}
.bar .track,.bar .done{position:absolute;left:0;top:11px;height:5px;border-radius:3px}
.bar .track{right:0;background:var(--line)} .bar .done{background:var(--sea)}
.bar .tick{position:absolute;top:7px;width:2px;height:13px;background:var(--muted);opacity:.45}
.bar .dot{position:absolute;top:3px;width:21px;height:21px;margin-left:-10px;border-radius:50%;background:var(--sun);border:3px solid var(--surface);box-shadow:0 0 0 1.5px var(--sun)}
.bar-labels{display:flex;justify-content:space-between;font-size:.74rem;color:var(--muted);margin-top:-4px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stat{display:grid;gap:0}
.stat b{font-family:var(--f-mono);font-weight:500;font-size:1.02rem}
.stat span{font-size:.76rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.source{font-size:.82rem;color:var(--muted)}

/* next move hero */
.hero{background:var(--sea-deep);color:var(--on-sea);border-radius:var(--r);padding:18px;display:grid;gap:12px}
.hero .eyebrow{color:var(--on-sea);opacity:.75}
.hero h2{font-size:2rem}
.hero .when{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.hero .when .t{font-family:var(--f-mono);font-size:1.5rem}
.count{background:var(--sun);color:var(--sun-ink);border-radius:999px;padding:3px 12px;font-weight:700;font-size:.92rem;white-space:nowrap}
.legs{list-style:none;margin:0;padding:0;display:grid;gap:6px;font-size:.95rem}
.legs li{display:grid;grid-template-columns:22px 1fr;gap:8px;align-items:start}
.legs .ic{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;background:rgba(255,255,255,.14);font-size:.72rem;font-weight:700;font-family:var(--f-display)}
.hero .then{border-top:1px solid rgba(255,255,255,.18);padding-top:10px;font-size:.92rem;opacity:.9}

.btns{display:flex;flex-wrap:wrap;gap:8px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:10px 16px;font-weight:700;cursor:pointer;min-height:46px;text-decoration:none;color:var(--ink);font-size:.95rem}
.btn.primary{background:var(--sea);border-color:var(--sea);color:var(--surface)}
.btn.sun{background:var(--sun);border-color:var(--sun);color:var(--sun-ink)}
.btn.onsea{background:var(--on-sea);border-color:var(--on-sea);color:var(--sea-deep)}
.btn.onsea-ghost{background:transparent;border-color:rgba(255,255,255,.4);color:var(--on-sea)}
.btn.block{flex:1 1 140px}
.btn:active{transform:translateY(1px)}
.btn svg{width:18px;height:18px;flex:none}

/* location pill */
.where{display:flex;align-items:center;justify-content:space-between;gap:10px}
.where b{display:block}
.chip{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:8px 14px;font-weight:700;cursor:pointer;min-height:40px;white-space:nowrap}

/* options */
.opts{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.opt{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:2px 10px;align-items:center;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);cursor:pointer;text-align:left;width:100%}
.opt .k{font-family:var(--f-mono);font-size:.82rem;color:var(--muted)}
.opt .nm{font-weight:700;min-width:0}
.opt .sub{grid-column:2 / 4;font-size:.84rem;color:var(--muted)}
.pill{font-family:var(--f-display);font-weight:700;text-transform:uppercase;letter-spacing:.06em;font-size:.82rem;border-radius:999px;padding:2px 10px;white-space:nowrap;border:1.5px solid currentColor}
.pill.good{color:var(--good)} .pill.warn{color:var(--warn)} .pill.bad{color:var(--bad)}

/* plan */
.steps{list-style:none;margin:0;padding:0;display:grid}
.step{display:grid;grid-template-columns:30px minmax(0,1fr);gap:12px;position:relative;padding-bottom:18px}
.step:not(:last-child)::before{content:"";position:absolute;left:14px;top:30px;bottom:0;width:2px;background:var(--line)}
.step .n{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-weight:700;background:var(--sun);color:var(--sun-ink);position:relative;z-index:1}
.step.go .n{background:var(--sea-soft);color:var(--sea);font-size:.75rem}
.step .t{font-family:var(--f-mono);font-size:.9rem}
.step .body{display:grid;gap:6px;min-width:0}
.step .btns .btn{min-height:40px;padding:8px 14px;font-size:.88rem}

/* map */
.mapbox{position:relative;border-radius:var(--r);overflow:hidden;border:1px solid var(--line);background:var(--map-bg)}
#map{height:min(64vh,560px);min-height:340px;width:100%;background:var(--map-bg)}
.map-ctrl{position:absolute;right:10px;top:10px;z-index:500;display:grid;gap:8px}
.map-ctrl button{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;min-width:56px;min-height:40px;padding:0 8px;font-weight:700;font-size:.8rem;cursor:pointer;box-shadow:0 1px 4px rgba(0,0,0,.15)}
.map-note{position:absolute;left:10px;bottom:10px;right:64px;z-index:500;background:var(--surface);border-radius:10px;padding:6px 10px;font-size:.78rem;color:var(--muted);box-shadow:0 1px 4px rgba(0,0,0,.15)}

/* ---------- time ---------- */
const fHM=new Intl.DateTimeFormat('en-GB',{timeZone:TZ,hour:'2-digit',minute:'2-digit'});
const fHMS=new Intl.DateTimeFormat('en-GB',{timeZone:TZ,hour:'2-digit',minute:'2-digit',second:'2-digit'});
const hm=t=>fHM.format(t);
function at(hhmm){const p=String(hhmm).trim().split(':');if(p.length<2)return NaN;const s=p.map(x=>x.padStart(2,'0'));while(s.length<3)s.push('00');
  return Date.parse(`${RACE_DATE}T${s[0]}:${s[1]}:${s[2]}${OFFSET}`);}
function fmtDur(ms){const t=Math.round(Math.abs(ms)/1000),h=Math.floor(t/3600),m=Math.floor(t%3600/60),s=t%60;return h+':'+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');}
function inMin(ms){const m=Math.round(ms/MIN);if(Math.abs(m)<1)return'now';const a=Math.abs(m),h=Math.floor(a/60),r=a%60,txt=h?`${h} h ${String(r).padStart(2,'0')}`:`${a} min`;return m>0?`in ${txt}`:`${txt} ago`;}
const pace=ms=>{const s=Math.round(ms/1000);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');};
const kmTxt=k=>k>=FULL-0.01?'42.2':(+k).toFixed(1).replace(/\.0$/,'');
const simBase=at('07:30');
function simActive(){if(S.simOn!==null)return S.simOn;const t=Date.now();return t<at('07:00')||t>at('17:00');}
function now(){return simActive()?simBase+(+S.sim)*MIN:Date.now();}

/* ---------- course ---------- */
function spots(){return SPOTS.map((s,i)=>Object.assign({},s,{n:i+1,km:S.km[s.id]!=null?+S.km[s.id]:s.km,walk:S.walk[s.id]!=null?+S.walk[s.id]:s.walk})).sort((a,b)=>a.km-b.km);}
function spotById(id){return spots().find(s=>s.id===id);}
function locations(){return spots().map(s=>({id:s.id,label:s.name,sub:`km ${kmTxt(s.km)}`,st:s.st,walk:s.walk,spot:s,lat:s.lat,lon:s.lon}))
  .concat(STATIONS.map(s=>({id:'st:'+s.id,label:s.name+' station',sub:'station',st:s.id,walk:0,spot:null,lat:s.lat,lon:s.lon})));}
function locById(id){return locations().find(l=>l.id===id)||locations()[0];}
function pointAt(km){if(!COURSE.length)return null;km=Math.max(0,Math.min(FULL,km));
  for(let i=1;i<COURSE.length;i++){const a=COURSE[i-1],b=COURSE[i];if(km<=b[2]){const f=(km-a[2])/((b[2]-a[2])||1);return[a[0]+(b[0]-a[0])*f,a[1]+(b[1]-a[1])*f];}}
  const l=COURSE[COURSE.length-1];return[l[0],l[1]];}
function lineUpTo(km){const out=[];for(const c of COURSE){if(c[2]<=km)out.push([c[0],c[1]]);else break;}const p=pointAt(km);if(p)out.push(p);return out;}

/* ---------- runner model ---------- */
function cross(){return at(S.gun)+(+S.delay||0)*MIN;}
function targetMs(){return((+S.th||0)*60+(+S.tm||0))*MIN||4*3600000;}
function targetPace(){return targetMs()/FULL;}
function points(){return[{km:0,t:cross()}].concat(S.splits.filter(s=>s.km>0).sort((a,b)=>a.km-b.km));}
function lastPt(){const p=points();return p[p.length-1];}
function livePace(){const l=lastPt();return l.km>0?(l.t-cross())/l.km:targetPace();}
function futurePace(){const l=lastPt();return l.km>0?livePace()*(1+(+S.slow||0)/100):targetPace();}
function eta(km){const p=points();for(let i=1;i<p.length;i++){if(km<=p[i].km){const a=p[i-1],b=p[i];return a.t+(b.t-a.t)*(km-a.km)/((b.km-a.km)||1);}}
  const l=p[p.length-1];return l.t+(km-l.km)*futurePace();}
function kmAt(t){const p=points();if(t<=p[0].t)return 0;for(let i=1;i<p.length;i++){if(t<=p[i].t){const a=p[i-1],b=p[i];return a.km+(b.km-a.km)*(t-a.t)/((b.t-a.t)||1);}}
  const l=p[p.length-1];return Math.min(FULL,l.km+(t-l.t)/futurePace());}
function nearestTown(k){return spots().reduce((a,s)=>Math.abs(s.km-k)<Math.abs(a.km-k)?s:a).town;}

/* ---------- travel ---------- */
function waitMin(){return S.conservative?+S.headway:+S.headway/2;}
function trip(from,to){const a=stById[from.st],b=stById[to.st];
  if(from.st===to.st){const m=(from.walk||0)+to.walk;return{min:m,train:false,legs:[{ic:'W',txt:`Walk about ${m} min to ${to.name}`}]};}
  const ride=Math.max(2,Math.abs(b.ride-a.ride)),m=(from.walk||0)+waitMin()+ride+2+to.walk,legs=[];
  if(from.walk)legs.push({ic:'W',txt:`Walk ${from.walk} min to ${a.name} station`});
  legs.push({ic:'T',txt:`Train to ${b.name} · ${ride} min ride (allow ${Math.round(waitMin())} min for the next train)`});
  legs.push({ic:'W',txt:`Walk ${to.walk} min to the course`});
  return{min:m,train:true,legs,fromSt:a,toSt:b};}
function status(slack){return slack>=+S.buffer?['good','Catch']:slack>=0?['warn','Tight']:['bad','Miss'];}
function fromOf(loc){return{st:loc.st,walk:loc.walk||0};}

/* Most sightings reachable from a location, in course order (dynamic programming). */
function bestPlan(fromId){
  const t0=now(),loc=locById(fromId),list=spots(),rk=kmAt(t0);
  let depart=t0,seed=null;
  if(loc.spot&&eta(loc.spot.km)>=t0){seed={spot:loc.spot,see:eta(loc.spot.km)};depart=seed.see+MIN;}
  const minKm=seed?seed.spot.km:rk;
  const cand=list.filter(s=>s.km>minKm+0.05&&eta(s.km)>t0),best=[];
  cand.forEach((s,j)=>{const see=eta(s.km);let b=null;
    const consider=(count,minSlack,prev,dep,from)=>{const tr=trip(from,s),arr=dep+tr.min*MIN,slack=(see-arr)/MIN;if(slack<+S.buffer)return;
      const ms=Math.min(minSlack,slack);if(!b||count>b.count||(count===b.count&&ms>b.minSlack))b={count,minSlack:ms,prev,dep,arr,slack,tr,spot:s,see};};
    const w=s.id==='finish'?0.9:1;
    consider((seed?1:0)+w,Infinity,-1,depart,fromOf(loc));
    for(let i=0;i<j;i++){const p=best[i];if(p)consider(p.count+w,p.minSlack,i,p.see+MIN,{st:p.spot.st,walk:p.spot.walk});}
    best[j]=b;});
  /* Rank plans: most sightings; then still reaching the finish before them; then a comfortable 10-min margin; then the earlier sighting. */
  const fin0=list.find(s=>s.id==='finish');
  const key=b=>{let meetOk=1;if(fin0&&b.spot.id!=='finish'){const tr=trip({st:b.spot.st,walk:b.spot.walk},fin0);meetOk=b.see+MIN+tr.min*MIN<=eta(FULL)?1:0;}
    return[Math.round(b.count*10),meetOk,b.minSlack>=10?1:0,-b.spot.km];};
  const better=(x,y)=>{for(let i=0;i<x.length;i++){if(x[i]!==y[i])return x[i]>y[i];}return false;};
  let end=-1,ek=null;best.forEach((b,j)=>{if(!b)return;const k=key(b);if(end<0||better(k,ek)){end=j;ek=k;}});
  const chain=[];for(let j=end;j>=0;j=best[j].prev)chain.unshift(best[j]);
  /* If the plan doesn't end at the finish, add the trip to meet them there. */
  let meet=null;const fin=list.find(s=>s.id==='finish'),last=chain.length?chain[chain.length-1]:seed;
  if(fin&&(!last||last.spot.id!=='finish')){const dep=last?last.see+MIN:depart,from=last?{st:last.spot.st,walk:last.spot.walk}:fromOf(loc),tr=trip(from,fin);
    meet={spot:fin,dep,tr,arr:dep+tr.min*MIN,see:eta(FULL)};}
  return{seed,chain,loc,rk,t0,meet};}

function runnerCard(){

  const ticks=[10,21.1,30].map(x=>`<span class="tick" style="left:${x/FULL*100}%"></span>`).join('');
  const head=!started?`<div class="big">Starts <small>${inMin(cross()-t)}</small></div>`:done?`<div class="big">Finished <small>≈ ${hm(fin)}</small></div>`:`<div class="big">km ${k.toFixed(1)}<small>near ${esc(nearestTown(k))}</small></div>`;

      <div class="stat"><b>${pace(l.km>0?livePace():targetPace())}</b><span>pace /km</span></div>
      <div class="stat"><b>${hm(fin)}</b><span>finish ≈</span></div>
      <div class="stat"><b>${fmtDur(fin-cross())}</b><span>race time</span></div>

      <button class="btn" data-act="split" style="min-height:40px;padding:6px 14px">Update position</button></div>
  </section>`;}

function heroCard(){
  const p=bestPlan(S.loc),t=p.t0;

    return `<section class="hero"><span class="eyebrow">Stay where you are</span>

function optionsCard(){
  const t=now(),loc=locById(S.loc),rk=kmAt(t);let depart=t,minKm=rk;
  if(loc.spot&&eta(loc.spot.km)>=t){depart=eta(loc.spot.km)+MIN;minKm=loc.spot.km;}
  let missed=0;
  const rows=spots().filter(s=>s.km>minKm+0.05&&s.id!==loc.id).map(s=>{
    const tr=trip(fromOf(loc),s),arr=depart+tr.min*MIN,see=eta(s.km),slack=(see-arr)/MIN,[c,l]=status(slack);
    if(c==='bad'){missed++;return'';}
    return `<li><button class="opt" data-act="spot" data-id="${s.id}"><span class="k">km ${kmTxt(s.km)}</span><span class="nm">${esc(s.name)}</span><span class="pill ${c}">${l} +${Math.round(slack)}</span>
      <span class="sub">Runner ≈ ${hm(see)} · you ≈ ${hm(arr)} · ${tr.train?'train to '+esc(tr.toSt.name):'on foot'}</span></button></li>`;}).join('');
  return `<section class="card"><div class="where"><div><span class="eyebrow">You are at</span><b>${esc(loc.label)}</b></div><button class="chip" data-act="where">Change</button></div>
    <h3>All reachable spots</h3>
    ${rows?`<ul class="opts">${rows}</ul>`:'<p class="empty">None from here. Head for the finish.</p>'}
    <p class="small muted">${missed?`${missed} nearer spot${missed>1?'s are':' is'} out of reach. `:''}Leaving ${loc.spot&&eta(loc.spot.km)>=t?'after they pass you':'now'}; “Catch” means at least ${S.buffer} min spare. Trains every ${S.headway} min${S.conservative?', assuming you just missed one':''}.</p>
  </section>`;}

  const run=L.marker(pointAt(0),{zIndexOffset:1000,keyboard:false,icon:L.divIcon({className:'',html:'<div class="m-run"><div class="d"></div><div class="lbl"></div></div>',iconSize:[26,26],iconAnchor:[13,13]})}).addTo(map);
  M={map,done,run,spotMarkers,me:null,sel:M&&M.sel||nextSpotId(),full};
  const focus=()=>{const sel=spotById(M.sel),pts=[pointAt(kmAt(now()))];if(sel)pts.push([sel.lat,sel.lon]);const lo=locById(S.loc);pts.push([lo.lat,lo.lon]);
    map.fitBounds(L.latLngBounds(pts),{padding:[50,50],maxZoom:15});};
  const zc=()=>map.getContainer().classList.toggle('z-low',map.getZoom()<13);map.on('zoomend',zc);
  focus();zc();
  $('#mRun').onclick=()=>map.setView(run.getLatLng(),Math.max(map.getZoom(),14));

function mapTick(){if(!M||!document.getElementById('map'))return;
  const t=now(),k=kmAt(t),p=pointAt(k);
  M.run.setLatLng(p);const lbl=M.run.getElement()&&M.run.getElement().querySelector('.lbl');
  if(lbl)lbl.textContent=t<cross()?'Start '+hm(cross()):k>=FULL-0.001?'Finished':`≈ km ${k.toFixed(1)}`;
  M.done.setLatLngs(lineUpTo(k));
  spots().forEach(s=>{const el=M.spotMarkers[s.id]&&M.spotMarkers[s.id].getElement();if(el){const d=el.firstChild;d.classList.toggle('passed',s.km<=k);d.classList.toggle('sel',s.id===M.sel);}});}
function nextSpotId(){const k=kmAt(now());const s=spots().find(x=>x.km>k);return s?s.id:'finish';}
function mapInfo(id){const box=$('#mapInfo');if(!box)return;const s=spotById(id);if(!s)return;
  const t=now(),see=eta(s.km),k=kmAt(t),loc=locById(S.loc),passed=s.km<=k;
  const waiting=loc.spot&&eta(loc.spot.km)>=t&&loc.spot.km<s.km,dep=waiting?eta(loc.spot.km)+MIN:t;
  const tr=s.id===loc.id?null:trip(fromOf(loc),s),arr=tr?dep+tr.min*MIN:t,slack=(see-arr)/MIN,[c,l]=status(slack);
  const st=stById[s.st];
  box.innerHTML=`<div class="runner-top"><span class="eyebrow">Spot ${s.n} · km ${kmTxt(s.km)} · ${esc(s.town)}</span>${passed?'<span class="pill bad">Passed</span>':tr?`<span class="pill ${c}">${l}${c!=='bad'?' +'+Math.round(slack):''}</span>`:'<span class="pill good">You are here</span>'}</div>
    <h2>${esc(s.name)}</h2>
    <p>${passed?`${esc(runnerName())} passed here ≈ ${hm(see)}.`:`${esc(runnerName())} due ≈ <b class="mono">${hm(see)}</b> (${inMin(see-t)}).`}${tr&&!passed?` From ${esc(loc.label)} you'd arrive ≈ <b class="mono">${hm(arr)}</b> leaving ${waiting?'after they pass you at '+hm(dep):'now'}.`:''}</p>
    <p class="small muted">${esc(s.note)} Nearest station: ${esc(st.name)}, ${s.walk} min walk.</p>
    <div class="btns">${navButtons(s,tr,['primary',''])}<a class="btn block" href="${gPin(s.lat,s.lon)}" target="_blank" rel="noopener">Open pin</a>
      ${s.id===loc.id?'':`<button class="btn block" data-act="arrived" data-id="${s.id}">I'm here</button>`}</div>`;}
function stationInfo(id){const box=$('#mapInfo');if(!box)return;const s=stById[id];const served=spots().filter(x=>x.st===id);
  box.innerHTML=`<span class="eyebrow">Train station</span><h2>${esc(s.name)}</h2>
    <p class="small muted">About ${s.ride} min from Nice Ville on a stopping TER. ${served.length?'Closest station for: '+served.map(x=>esc(x.name)).join(', ')+'.':''}</p>
    <div class="btns"><a class="btn primary block" href="${gDir(s.lat,s.lon,'walking')}" target="_blank" rel="noopener">${ICON.walk}Walk here</a>

function locateMe(){
  if(!navigator.geolocation){toast('Location is not available in this browser.');return;}
  navigator.geolocation.getCurrentPosition(pos=>{const ll=[pos.coords.latitude,pos.coords.longitude];
    if(M&&document.getElementById('map')){if(!M.me)M.me=L.marker(ll,{icon:L.divIcon({className:'',html:'<div class="m-me"></div>',iconSize:[18,18],iconAnchor:[9,9]}),keyboard:false}).addTo(M.map);else M.me.setLatLng(ll);M.map.setView(ll,15);}
    const n=nearestLoc(ll);toast(`You're nearest ${n.label}.`);},
    ()=>toast('Location was not shared. Allow it for Safari in Settings › Privacy › Location Services, or pick your spot by hand.'),{enableHighAccuracy:true,timeout:10000});}
function dist(a,b){const k=Math.cos(a[0]*Math.PI/180);return Math.hypot((a[0]-b[0])*111,(a[1]-b[1])*111*k);}
function nearestLoc(ll){return locations().reduce((a,l)=>dist(ll,[l.lat,l.lon])<dist(ll,[a.lat,a.lon])?l:a);}

/* ---------- plan ---------- */
function planView(){
  const p=bestPlan(S.loc);let n=0;const steps=[];

    steps.push(`<li class="step"><span class="n">${++n}</span><div class="body"><div><b>${esc(c.spot.name)}</b> <span class="t">km ${kmTxt(c.spot.km)} · ≈ ${hm(c.see)}</span></div>

    <dt>Pass Marathon · €8</dt><dd>Unlimited TER travel between Nice-Riquier and Cannes on Sunday 8 November. Buy it in the SNCF Connect app before you set off.</dd>

/* ---------- sheets ---------- */
function openSheet(html,after){const d=$('#sheet');$('#sheetIn').innerHTML=html;if(typeof d.showModal==='function'){if(!d.open)d.showModal();}else d.setAttribute('open','');
  $$('#sheetIn [data-close]').forEach(b=>b.onclick=closeSheet);if(after)after();}
function closeSheet(){const d=$('#sheet');if(d.open&&d.close)d.close();else d.removeAttribute('open');}
function whereSheet(){
  const cur=S.loc,item=l=>`<li><button data-pick="${l.id}" aria-current="${l.id===cur}"><span>${esc(l.label)}</span><span class="k">${esc(l.sub)}</span></button></li>`;

  openSheet(`<div class="sheet-head"><h2>Where are you?</h2><button class="close" data-close aria-label="Close">✕</button></div>
    <button class="btn primary" id="useLoc">${ICON.nav}Use my location</button>
    <ul class="picklist"><li class="group">Viewing spots</li>${ls.filter(l=>l.spot).map(item).join('')}<li class="group">Stations</li>${ls.filter(l=>!l.spot).map(item).join('')}</ul>`,()=>{
    $$('[data-pick]').forEach(b=>b.onclick=()=>{setLoc(b.dataset.pick);closeSheet();});

        ()=>toast('Location was not shared. Pick from the list instead.'),{enableHighAccuracy:true,timeout:10000});};});}
function setLoc(id){S.loc=id;save();render();toast(`Location: ${locById(id).label}`);}

let splitMode='chip',splitKm=null;
function splitSheet(){
  const k=kmAt(now()),preset=[5,10,15,20,21.1,25,30,35,40];
  openSheet(`<div class="sheet-head"><h2>Update position</h2><button class="close" data-close aria-label="Close">✕</button></div>
    <p class="small muted">Copy a split from the official tracking. Chip time is the runner's own race time; clock time is the time of day they passed.</p>
    <div><span class="lbl">Distance (km)</span><div class="kms" id="kms">${preset.map(x=>`<button type="button" data-k="${x}" aria-pressed="${splitKm===x}">${x}</button>`).join('')}</div></div>
    <div class="field"><label for="kmIn">Or type km</label><input id="kmIn" inputmode="decimal" placeholder="${k.toFixed(1)}" value="${splitKm!=null&&!preset.includes(splitKm)?splitKm:''}"></div>
    <div class="seg" role="group" aria-label="Time type"><button type="button" data-m="chip" aria-pressed="${splitMode==='chip'}">Chip time</button><button type="button" data-m="clock" aria-pressed="${splitMode==='clock'}">Clock time</button></div>
    <div id="tChip" class="grid3" ${splitMode==='chip'?'':'hidden'}>
      <div class="field"><label for="ch">h</label><input id="ch" type="number" min="0" max="7" inputmode="numeric" placeholder="1"></div>
      <div class="field"><label for="cm">min</label><input id="cm" type="number" min="0" max="59" inputmode="numeric" placeholder="52"></div>
      <div class="field"><label for="cs">sec</label><input id="cs" type="number" min="0" max="59" inputmode="numeric" placeholder="0"></div></div>
    <div id="tClock" class="field" ${splitMode==='clock'?'':'hidden'}><label for="ck">Clock time</label><input id="ck" type="time" value="${hm(now())}"></div>
    <p class="small" id="splitErr" role="alert" style="color:var(--bad)"></p>
    <button class="btn primary" id="saveSplit" type="button">Save position</button>`,()=>{
    $$('#kms [data-k]').forEach(b=>b.onclick=()=>{splitKm=+b.dataset.k;$('#kmIn').value='';$$('#kms [data-k]').forEach(x=>x.setAttribute('aria-pressed',x===b));});
    $('#kmIn').oninput=()=>{splitKm=null;$$('#kms [data-k]').forEach(x=>x.setAttribute('aria-pressed','false'));};
    $$('[data-m]').forEach(b=>b.onclick=()=>{splitMode=b.dataset.m;$$('[data-m]').forEach(x=>x.setAttribute('aria-pressed',x===b));$('#tChip').hidden=splitMode!=='chip';$('#tClock').hidden=splitMode!=='clock';});
    $('#saveSplit').onclick=()=>{const err=m=>$('#splitErr').textContent=m;
      const km=$('#kmIn').value.trim()?parseFloat($('#kmIn').value.replace(',','.')):splitKm;
      if(!(km>0&&km<=FULL))return err('Choose or type a distance between 0 and 42.2 km.');
      let t;if(splitMode==='chip'){const h=+$('#ch').value||0,m=+$('#cm').value||0,s=+$('#cs').value||0;if(!(h||m))return err('Enter the chip time (hours and minutes).');if(m>59||s>59)return err('Minutes and seconds go up to 59.');t=cross()+((h*60+m)*60+s)*1000;}
      else{const v=$('#ck').value;if(!v)return err('Enter the clock time.');t=at(v);}
      const r=addSplit(km,t);if(r)return err(r);closeSheet();toast(`Saved km ${kmTxt(km)} at ${hm(t)}. Predictions updated.`);splitKm=null;};});}

/* Validate and store a position. Returns an error message or ''. */
function addSplit(km,t){
  const others=S.splits.filter(s=>Math.abs(s.km-km)>0.05),pts=[{km:0,t:cross()}].concat(others).sort((a,b)=>a.km-b.km);
  let prev=pts[0],next=null;for(const p of pts){if(p.km<km)prev=p;else if(p.km>km&&!next)next=p;}
  if(t<=prev.t)return`That time is before km ${kmTxt(prev.km)} (${hm(prev.t)}). Check the time or the start settings.`;
  if(next&&t>=next.t)return`That time is after km ${kmTxt(next.km)} (${hm(next.t)}).`;
  const pc=(t-prev.t)/(km-prev.km)/1000;if(pc<150||pc>900)return`That works out at ${pace(pc*1000)} per km since km ${kmTxt(prev.km)}, which looks wrong. Check the km and time.`;
  S.splits=others.concat([{km,t}]);save();render();return'';}

let seenArmed=0;
function seen(){const loc=locById(S.loc);if(!loc.spot){toast('Choose the spot you are at first.');whereSheet();return;}
  const t=now(),s=loc.spot;
  if(s.km===0){const d=Math.round((t-at(S.gun))/MIN);if(d<0||d>40){toast('That is outside the start window.');return;}S.delay=d;save();render();toast(`Start-line crossing set to ${d} min after the gun.`);return;}
  const diff=(t-eta(s.km))/MIN;
  if(Math.abs(diff)>20&&Date.now()-seenArmed>6000){seenArmed=Date.now();toast(`That's ${Math.round(Math.abs(diff))} min ${diff>0?'later':'earlier'} than predicted. Tap again to confirm.`);return;}
  seenArmed=0;const r=addSplit(s.km,t);toast(r||`Logged km ${kmTxt(s.km)} at ${hm(t)}. Predictions updated.`);}

  if(v!=='map'&&M&&M.map){M.map.remove();M={sel:M.sel};}
  ({live:liveView,map:mapView,plan:planView,runner:runnerView})[v]();}
function tick(){const v=view(),busy=$('#sheet').open||(document.activeElement&&/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName)&&document.activeElement.id!=='simT');
  if(v==='map'){mapTick();if(M&&M.sel)mapInfo(M.sel);}else if(v!=='runner'&&!busy){const y=scrollY;({live:liveView,plan:planView})[v]();scrollTo(0,y);}}
window.addEventListener('hashchange',()=>{render();scrollTo(0,0);});
setInterval(header,1000);setInterval(()=>{if(!simActive())tick();},15000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden){header();tick();}});
if(!S.runner&&!location.hash)location.hash='#live';
render();
})();
</script>
